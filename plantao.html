<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#061a1e" />
  <title id="page-title">Plantão · UPA de Humildes</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="./index.html" class="btn-back" aria-label="Voltar"><i data-lucide="arrow-left"></i> Voltar</a>
      <div class="topbar-logo" aria-hidden="true"><i data-lucide="heart-pulse"></i></div>
      <div class="topbar-title">
        <span class="topbar-name" id="turno-label">Plantão</span>
        <span class="topbar-sub">UPA de Humildes</span>
      </div>
      <button id="btn-settings" class="btn-settings" aria-label="Configurações" title="Definir número do WhatsApp"><i data-lucide="settings"></i></button>
    </div>

    <div class="field">
      <label class="field-label"><i data-lucide="calendar"></i> Data e Hora</label>
      <input type="text" id="dataHora" class="field-input" readonly />
    </div>

    <div class="field">
      <label class="field-label"><i data-lucide="building-2"></i> Unidade</label>
      <input type="text" id="unidade" class="field-input" value="UPA DE HUMILDES" />
    </div>

    <div class="section-header"><i data-lucide="users"></i> Equipe do Plantão</div>
    <div id="equipe-container"></div>

    <div class="section-header"><i data-lucide="heart-pulse"></i> Pacientes por Setor</div>
    <div id="pacientes-container"></div>

    <div class="section-header"><i data-lucide="clipboard-list"></i> Fluxo (Quantidade)</div>
    <div id="fluxo-container"></div>

    <div class="section-header"><i data-lucide="arrow-right-left"></i> Transferências / Saídas</div>
    <div id="transferencias-container"></div>

    <div class="section-header"><i data-lucide="file-text"></i> Observação Final</div>
    <textarea id="obsFinal" class="field-textarea" rows="2" placeholder="Registre aqui qualquer intercorrência ou observação relevante do plantão..."></textarea>

    <button type="button" id="btn-whatsapp" class="btn-whatsapp"><i data-lucide="send"></i> Enviar via WhatsApp</button>
  </div>

  <!-- Modal de configurações -->
  <div id="modal-settings" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h3 class="modal-title"><i data-lucide="settings"></i> Configurações do WhatsApp</h3>
      <label class="field-label"><i data-lucide="message-circle"></i> Número de destino (com DDI + DDD)</label>
      <input type="tel" id="wa-number" class="field-input" placeholder="Ex: 5571999999999" />
      <p class="modal-hint">Formato: código do país + DDD + número (sem espaços ou traços). Se deixar em branco, o WhatsApp abrirá para você escolher o contato.</p>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="btn-modal-cancel">Cancelar</button>
        <button type="button" class="btn-primary" id="btn-modal-save">Salvar</button>
      </div>
    </div>
  </div>

  <div id="net-status" class="net-status"><span class="net-dot"></span><span id="net-label">Online</span></div>
  <button id="theme-toggle" class="floating-theme" aria-label="Alternar tema" title="Alternar tema claro/escuro"><i data-lucide="sun"></i></button>

  <script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.min.js"></script>
  <script src="./common.js"></script>
  <script src="./plantao.js"></script>
</body>
</html>
